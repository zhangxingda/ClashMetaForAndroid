name: Build Windows Device Notice Installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: customization
      - uses: actions/checkout@v4
        with:
          repository: clash-verge-rev/clash-verge-rev
          ref: ea509b82363a40c3c32e951d7ce9d66d66da411f
          path: verge
      - name: Apply subscription customization
        run: python customization/windows-device-notice/prepare.py verge
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verge -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'
      - name: Install dependencies and prepare Windows resources
        working-directory: verge
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild x86_64-pc-windows-msvc
      - name: Build Windows installer
        working-directory: verge
        env:
          HUSKY: '0'
          CARGO_INCREMENTAL: '0'
        run: pnpm build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-Rev-Windows-Device-Notice-x64
          path: verge/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Archive matching GPL source
        shell: pwsh
        run: |
          git -C verge archive HEAD -o "$env:GITHUB_WORKSPACE/upstream-source.zip"
          Expand-Archive upstream-source.zip patched-source
          Copy-Item verge/src-tauri/src/utils/subscription_device.rs patched-source/src-tauri/src/utils/
          Copy-Item verge/src-tauri/src/utils/mod.rs patched-source/src-tauri/src/utils/
          Copy-Item verge/src-tauri/src/config/prfitem.rs patched-source/src-tauri/src/config/
          Copy-Item verge/src-tauri/tauri.conf.json patched-source/src-tauri/
          Compress-Archive -Path patched-source/* -DestinationPath Clash-Verge-Rev-Device-Notice-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-Rev-Device-Notice-Source
          path: Clash-Verge-Rev-Device-Notice-Source.zip
